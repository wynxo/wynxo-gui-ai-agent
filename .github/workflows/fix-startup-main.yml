name: Fix Wynxo startup on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-main.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix inherited Qt notify signal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wynxo/workspace.py')
          text = path.read_text(encoding='utf-8')
          old = '@Property(str, notify=changed)'
          count = text.count(old)
          if count < 1:
              raise SystemExit('Expected inherited notify=changed property was not found')
          text = text.replace(old, '@Property(str, notify=Controller.changed)')
          path.write_text(text, encoding='utf-8')
          print(f'fixed {count} inherited notify declaration(s)')
          PY
      - name: Remove one-shot workflow and commit to main
        run: |
          rm .github/workflows/fix-startup-main.yml
          git config user.name 'wynxo-ci'
          git config user.email '318229878+wynxo@users.noreply.github.com'
          git add wynxo/workspace.py .github/workflows/fix-startup-main.yml
          git commit -m 'Fix Wynxo startup import crash'
          git push origin HEAD:main
