name: Stabilize UI layout on main

on:
  push:
    paths:
      - '.github/workflows/ui-stabilize-main.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stabilize Chat workspace and centered transient surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('wynxo/ui/Main.qml')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    readonly property bool homeMode: bridge && !bridge.hasMessages\n',
              '    readonly property bool homeMode: bridge && !bridge.hasMessages\n'
              '    // Chat is intentionally conversation-only. Do not leave a rail full of\n'
              '    // unavailable workspace tools hanging off the side of those tasks.\n'
              '    readonly property bool workspaceAvailable: !!(bridge && bridge.taskMode !== "chat")\n'
          )
          text = text.replace(
              '    readonly property bool dockOpen: roomForDock && !!(dockState && dockState.visible)\n',
              '    readonly property bool dockOpen: workspaceAvailable && roomForDock\n'
              '        && !!(dockState && dockState.visible)\n'
          )
          text = text.replace(
              '                dockAvailable: true\n',
              '                dockAvailable: window.workspaceAvailable\n'
          )

          old = '''                Rectangle {
                    Layout.fillWidth: false
                    Layout.preferredWidth: contentColumn.centredReadingWidth
                    Layout.alignment: Qt.AlignHCenter
                    visible: bridge && bridge.capabilityWarning.length > 0
                    Layout.preferredHeight: visible ? warningText.implicitHeight + Theme.s3 * 2 : 0
                    radius: Theme.r2
                    color: Theme.warningMuted
                    border.width: 1
                    border.color: Theme.alpha(Theme.warning, 0.3)
                    Accessible.role: Accessible.StaticText
                    Accessible.name: bridge ? bridge.capabilityWarning : ""
                    Row {
                        anchors.fill: parent
                        anchors.margins: Theme.s3
                        spacing: Theme.s3
                        Icon { name: "info"; ink: Theme.warning; width: 14; height: 14 }
                        Text {
                            id: warningText
                            width: parent.width - 14 - Theme.s3
                            text: bridge ? bridge.capabilityWarning : ""
                            color: Theme.textSecondary
                            font.family: Theme.sansFamily; font.pixelSize: Theme.caption
                            wrapMode: Text.WordWrap; lineHeight: 1.45
                        }
                    }
                }

                ErrorBanner {
                    Layout.fillWidth: false
                    Layout.preferredWidth: contentColumn.centredReadingWidth
                    Layout.alignment: Qt.AlignHCenter
                    onActionInvoked: function(action) { window.runCommand(action); }
                }
'''
          new = '''                Item {
                    id: warningLane
                    Layout.fillWidth: true
                    visible: bridge && bridge.capabilityWarning.length > 0
                    Layout.preferredHeight: visible ? warningCard.height : 0

                    Rectangle {
                        id: warningCard
                        width: Math.min(Theme.readingWidth, parent.width)
                        height: warningText.implicitHeight + Theme.s3 * 2
                        anchors.horizontalCenter: parent.horizontalCenter
                        radius: Theme.r2
                        color: Theme.warningMuted
                        border.width: 1
                        border.color: Theme.alpha(Theme.warning, 0.3)
                        Accessible.role: Accessible.StaticText
                        Accessible.name: bridge ? bridge.capabilityWarning : ""
                        Row {
                            anchors.fill: parent
                            anchors.margins: Theme.s3
                            spacing: Theme.s3
                            Icon { name: "info"; ink: Theme.warning; width: 14; height: 14 }
                            Text {
                                id: warningText
                                width: parent.width - 14 - Theme.s3
                                text: bridge ? bridge.capabilityWarning : ""
                                color: Theme.textSecondary
                                font.family: Theme.sansFamily; font.pixelSize: Theme.caption
                                wrapMode: Text.WordWrap; lineHeight: 1.45
                            }
                        }
                    }
                }

                Item {
                    id: errorLane
                    Layout.fillWidth: true
                    visible: bridge && bridge.error.length > 0
                    Layout.preferredHeight: visible ? errorBanner.implicitHeight : 0

                    ErrorBanner {
                        id: errorBanner
                        width: Math.min(Theme.readingWidth, parent.width)
                        anchors.horizontalCenter: parent.horizontalCenter
                        onActionInvoked: function(action) { window.runCommand(action); }
                    }
                }
'''
          if old not in text:
              raise SystemExit('warning/error layout block not found')
          text = text.replace(old, new)

          text = text.replace(
              '            visible: window.roomForDock\n',
              '            visible: window.roomForDock && window.workspaceAvailable\n',
              1
          )
          text = text.replace(
              '        dragMargin: 0\n        background: Rectangle { color: Theme.background }\n        WorkspaceDock {\n            id: drawerDock\n',
              '        dragMargin: 0\n        enabled: window.workspaceAvailable\n        background: Rectangle { color: Theme.background }\n        WorkspaceDock {\n            id: drawerDock\n',
              1
          )
          text = text.replace(
              '    function toggleDock() {\n        if (!window.roomForDock) {\n',
              '    function toggleDock() {\n        if (!window.workspaceAvailable) return;\n        if (!window.roomForDock) {\n'
          )
          text = text.replace(
              '    function openDock(tab) {\n        if (!window.dockState) return;\n',
              '    function openDock(tab) {\n        if (!window.workspaceAvailable || !window.dockState) return;\n'
          )

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_home_layout.py')
          source = test.read_text(encoding='utf-8')
          source += '''\n\ndef test_transient_surfaces_use_the_same_explicit_centering_lane():\n    text = MAIN.read_text(encoding="utf-8")\n    for lane_id, child_id in (("warningLane", "warningCard"), ("errorLane", "errorBanner")):\n        assert f"id: {lane_id}\\n" in text\n        child = text.split(f"id: {child_id}\\n", 1)[1].split("}", 1)[0]\n        assert "width: Math.min(Theme.readingWidth, parent.width)" in child\n        assert "anchors.horizontalCenter: parent.horizontalCenter" in child\n\n\ndef test_chat_mode_does_not_render_dead_workspace_chrome():\n    text = MAIN.read_text(encoding="utf-8")\n    assert 'readonly property bool workspaceAvailable: !!(bridge && bridge.taskMode !== "chat")' in text\n    assert "dockAvailable: window.workspaceAvailable" in text\n    assert "visible: window.roomForDock && window.workspaceAvailable" in text\n    assert "if (!window.workspaceAvailable) return;" in text\n'''
          test.write_text(source, encoding='utf-8')
          PY
      - name: Commit directly to main and remove one-shot workflow
        run: |
          rm .github/workflows/ui-stabilize-main.yml
          git config user.name 'wynxo-ci'
          git config user.email '318229878+wynxo@users.noreply.github.com'
          git add wynxo/ui/Main.qml tests/test_home_layout.py .github/workflows/ui-stabilize-main.yml
          git commit -m 'Stabilize Chat workspace and transient layout'
          git push origin main
