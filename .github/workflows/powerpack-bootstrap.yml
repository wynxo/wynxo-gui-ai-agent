name: Powerpack bootstrap

on:
  push:
    branches: [feat/local-powerpack]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap powerpack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-powerpack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply powerpack
        run: python tools/apply_powerpack.py
      - name: Validate sources
        run: python -m compileall -q wynxo tests
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest -q
      - name: Commit generated changes
        run: |
          git config user.name 'wynxo-powerpack-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add wynxo tests
          git commit -m 'feat: add local Ollama powerpack' || exit 0
          git push origin HEAD:feat/local-powerpack
