name: Fix continuity and shutdown on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-continuity-shutdown-main.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix restart-only plan recovery and idempotent shutdown
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wynxo/workspace.py')
          text = path.read_text(encoding='utf-8')

          old = '''        self._usage = TokenUsageTracker(self.store)\n        self._project_instructions_summary = project_instructions.summary(self._working_directory)\n'''
          new = '''        self._usage = TokenUsageTracker(self.store)\n        self._workspace_shutdown = False\n        self._project_instructions_summary = project_instructions.summary(self._working_directory)\n'''
          if old not in text:
              raise SystemExit('Workspace init anchor missing')
          text = text.replace(old, new, 1)

          old = '''        if task_id and self.store.get_conversation(task_id):\n            self.openTask(task_id)\n            return\n'''
          new = '''        if task_id and self.store.get_conversation(task_id):\n            self._recover_interrupted_plan(task_id)\n            self.openTask(task_id)\n            return\n'''
          if old not in text:
              raise SystemExit('Workspace restore anchor missing')
          text = text.replace(old, new, 1)

          old = '''    def _saved_plan(self, task_id: str) -> list[dict]:\n        plan = self._normalise_plan(self.store.get_setting(self._plan_key(task_id), []))\n        # A process restart cannot prove an old in-progress action completed.\n        # Reopen it as pending instead of presenting stale work as still running.\n        interrupted = False\n        for step in plan:\n            if step["status"] == "in_progress":\n                step["status"] = "pending"\n                interrupted = True\n        if interrupted:\n            self.store.set_setting(self._plan_key(task_id), plan)\n        return plan\n'''
          new = '''    def _saved_plan(self, task_id: str) -> list[dict]:\n        """Read persisted plan state without pretending a normal read is a restart."""\n        return self._normalise_plan(self.store.get_setting(self._plan_key(task_id), []))\n\n    def _recover_interrupted_plan(self, task_id: str) -> None:\n        """On process startup only, stale running steps become pending.\n\n        A restart cannot prove an in-progress action completed, but opening,\n        duplicating or inspecting a task during the same process must preserve\n        its live status exactly as stored.\n        """\n        plan = self._saved_plan(task_id)\n        interrupted = False\n        for step in plan:\n            if step["status"] == "in_progress":\n                step["status"] = "pending"\n                interrupted = True\n        if interrupted:\n            self.store.set_setting(self._plan_key(task_id), plan)\n'''
          if old not in text:
              raise SystemExit('Old saved-plan recovery block missing')
          text = text.replace(old, new, 1)

          old = '''    def shutdown(self):\n        if hasattr(self, "_draft_persist_timer"):\n            self._draft_persist_timer.stop()\n        self._persist_current_draft()\n        self._set_last_task(self._task_id)\n        super().shutdown()\n'''
          new = '''    def shutdown(self):\n        """Stop the workspace exactly once, even when a host calls twice.\n\n        Snapshot/demo controllers are rotated during rendering, so an older\n        controller may already have closed its store when process cleanup calls\n        shutdown again. Production close paths also benefit from idempotence.\n        """\n        if getattr(self, "_workspace_shutdown", False):\n            return\n        if hasattr(self, "_draft_persist_timer"):\n            self._draft_persist_timer.stop()\n        self._persist_current_draft()\n        self._set_last_task(self._task_id)\n        self._workspace_shutdown = True\n        super().shutdown()\n'''
          if old not in text:
              raise SystemExit('Workspace shutdown block missing')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit to main
        run: |
          rm .github/workflows/fix-continuity-shutdown-main.yml
          git config user.name 'wynxo-ci'
          git config user.email '318229878+wynxo@users.noreply.github.com'
          git add wynxo/workspace.py .github/workflows/fix-continuity-shutdown-main.yml
          git commit -m 'Fix restart plan recovery and idempotent shutdown'
          git push origin HEAD:main
