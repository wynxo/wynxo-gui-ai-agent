name: Apply context budget

on:
  push:
    branches: [work/finish-astra-gui-core]
    paths:
      - '.github/workflows/apply-context-budget.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/finish-astra-gui-core
          fetch-depth: 0
      - name: Add inference-only long-chat compaction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('wynxo/workspace.py')
          text = path.read_text()
          text = text.replace(
              'from . import context as ctx\n',
              'from . import context as ctx\nfrom . import context_budget\n',
              1,
          )

          start = text.index('class PlanningAgentEngine(AgentEngine):')
          end = text.index('\ndef validate_workspace_endpoint', start)
          replacement = '''class PlanningAgentEngine(AgentEngine):\n    """AgentEngine with planning, bounded history and project orientation."""\n\n    def run(self, *args, **kwargs):\n        # The complete conversation is the archive. Build a temporary recent\n        # view for this inference, then append only newly generated messages\n        # back onto the untouched archive. This applies to Chat, Work and Wynxi.\n        if args:\n            full_history = copy.deepcopy(list(args[0]))\n        else:\n            full_history = copy.deepcopy(list(kwargs.get("messages", [])))\n        fit = context_budget.fit_history(full_history, kwargs.get("num_ctx", 16384))\n        inference_messages = fit.messages\n\n        emit = args[4] if len(args) > 4 else kwargs.get("emit")\n        if fit.compacted and callable(emit):\n            emit({"type": "context_compacted", "omitted_turns": fit.omitted_turns,\n                  "estimated_tokens": fit.estimated_tokens})\n\n        desktop = self.desktop\n        tools_allowed = bool(kwargs.get("tools_allowed", True))\n        project = str(kwargs.get("project", "") or "")\n        if tools_allowed and desktop is not None and project:\n            inference_messages = project_context.inject(inference_messages, project)\n            inference_messages = project_instructions.inject(inference_messages, project)\n\n        if args:\n            run_args = (inference_messages,) + args[1:]\n            run_kwargs = kwargs\n        else:\n            run_args = args\n            run_kwargs = {**kwargs, "messages": inference_messages}\n\n        if desktop is None or not tools_allowed:\n            result = super().run(*run_args, **run_kwargs)\n        else:\n            original_execute = desktop.execute\n\n            def execute(name, arguments, cancel=None):\n                if name == "update_plan":\n                    return {"ok": True, "steps": len(arguments.get("steps", []))}\n                return original_execute(name, arguments, cancel)\n\n            # Runs are serialized by Controller; this temporary adapter exists\n            # only on the worker thread for the lifetime of this generation.\n            desktop.execute = execute\n            try:\n                result = super().run(*run_args, **run_kwargs)\n            finally:\n                desktop.execute = original_execute\n\n        # Strip generated system context before finding the engine's new tail.\n        result = project_instructions.strip(project_context.strip(result))\n        fitted = project_instructions.strip(project_context.strip(inference_messages))\n        return context_budget.merge_generated(full_history, fitted, result)\n\n'''
          text = text[:start] + replacement + text[end:]

          init_anchor = '''        self._project_instructions_summary = project_instructions.summary(self._working_directory)\n'''
          init_new = init_anchor + '        self._context_omitted_turns = 0\n'
          if init_anchor not in text:
              raise SystemExit('context omitted init anchor not found')
          text = text.replace(init_anchor, init_new, 1)

          property_anchor = '''    @Property(str, notify=changed)\n    def projectInstructionsSummary(self):\n        return self._project_instructions_summary\n\n'''
          property_add = '''    @Property(int, notify=changed)\n    def contextOmittedTurns(self):\n        return int(self._context_omitted_turns)\n\n    @Property(str, notify=changed)\n    def contextCompactionLabel(self):\n        count = int(self._context_omitted_turns)\n        if not count:\n            return ""\n        return (f"{count} older turn{'s' if count != 1 else ''} omitted from this model request; "\n                "full history is still saved")\n\n'''
          if property_anchor not in text:
              raise SystemExit('project instructions property anchor not found')
          text = text.replace(property_anchor, property_anchor + property_add, 1)

          start_anchor = '''    def _start_run(self, history):\n        self._refresh_project_instructions()\n        self._busy = True\n'''
          start_new = '''    def _start_run(self, history):\n        self._refresh_project_instructions()\n        self._context_omitted_turns = 0\n        self._busy = True\n'''
          if start_anchor not in text:
              raise SystemExit('start run reset anchor not found')
          text = text.replace(start_anchor, start_new, 1)

          event_anchor = '''    def _on_event(self, event):\n        kind = event.get("type")\n        if kind == "tool_start" and event.get("name") == "update_plan":\n'''
          event_new = '''    def _on_event(self, event):\n        kind = event.get("type")\n        if kind == "context_compacted":\n            self._context_omitted_turns = max(0, int(event.get("omitted_turns", 0) or 0))\n            self.changed.emit()\n            return\n        if kind == "tool_start" and event.get("name") == "update_plan":\n'''
          if event_anchor not in text:
              raise SystemExit('event anchor not found')
          text = text.replace(event_anchor, event_new, 1)
          path.write_text(text)

          qml = Path('wynxo/ui/Wynxo/ContextPanel.qml')
          ui = qml.read_text()
          meter_anchor = '''        Item {\n            Layout.fillWidth: true\n            Layout.preferredHeight: 34\n            visible: root.fraction > 0\n\n            ColumnLayout {\n                anchors.fill: parent\n                anchors.leftMargin: Theme.s3\n                anchors.rightMargin: Theme.s3\n                anchors.topMargin: Theme.s2\n                spacing: Theme.s1\n\n                RowLayout {\n                    Layout.fillWidth: true\n                    Text {\n                        Layout.fillWidth: true\n                        text: "Context window"\n                        color: Theme.textMuted\n                        font.family: Theme.sansFamily; font.pixelSize: Theme.micro\n                    }\n                    Text {\n                        text: Math.round(root.fraction * 100) + "%"\n                        color: root.fraction > 0.9 ? Theme.warning : Theme.textMuted\n                        font.family: Theme.monoFamily; font.pixelSize: Theme.micro\n                    }\n                }\n                Meter { Layout.fillWidth: true; value: root.fraction }\n            }\n        }\n\n'''
          notice = '''        Item {\n            Layout.fillWidth: true\n            Layout.preferredHeight: 34\n            visible: bridge && bridge.contextOmittedTurns > 0\n\n            RowLayout {\n                anchors.fill: parent\n                anchors.leftMargin: Theme.s3\n                anchors.rightMargin: Theme.s3\n                spacing: Theme.s2\n                Icon {\n                    name: "info"\n                    ink: Theme.textMuted\n                    Layout.preferredWidth: 12; Layout.preferredHeight: 12\n                }\n                Text {\n                    Layout.fillWidth: true\n                    text: bridge ? bridge.contextCompactionLabel : ""\n                    color: Theme.textMuted\n                    font.family: Theme.sansFamily; font.pixelSize: Theme.micro\n                    wrapMode: Text.Wrap\n                }\n            }\n        }\n\n'''
          if meter_anchor not in ui:
              raise SystemExit('ContextPanel meter anchor not found')
          ui = ui.replace(meter_anchor, meter_anchor + notice, 1)
          qml.write_text(ui)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-context-budget.yml
          git config user.name wynxo-ci
          git config user.email 318229878+wynxo@users.noreply.github.com
          git add wynxo/workspace.py wynxo/ui/Wynxo/ContextPanel.qml wynxo/context_budget.py tests/test_context_budget.py .github/workflows/apply-context-budget.yml
          git commit -m "Compact long chats without losing stored history"
          git push origin HEAD:work/finish-astra-gui-core
