name: Update permission regression for on-demand screen access

on:
  push:
    branches:
      - work/finish-astra-gui-core
    paths:
      - .github/workflows/apply-permission-screen-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/finish-astra-gui-core
      - name: Remove eager screenshot assumption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/test_permissions.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    # The opening screenshot and the scroll are both observation-only.\n":
              "    # Scroll is observation-only and never reaches the confirmation callback.\n",
              "    assert starts[\"screenshot\"][\"confirming\"] is False\n":
              "    assert \"screenshot\" not in starts\n",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit regression update
        run: |
          git config user.name "wynxo-ci"
          git config user.email "318229878+wynxo@users.noreply.github.com"
          git add tests/test_permissions.py
          git diff --cached --check
          git commit -m "Remove eager screenshot assumption from permission tests"
          git push origin HEAD:work/finish-astra-gui-core
