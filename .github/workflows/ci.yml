name: Test
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install package and test tools
        run: python -m pip install . pytest
      - name: Test
        run: python -m pytest -q
      - name: Validate Python sources
        run: python -m compileall -q wynxo install.py uninstall.py
      - name: Load native GUI
        run: python -m wynxo --smoke-test

  screenshots:
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    # Renders the real QML with fixed demo state so a UI regression is visible
    # in the artifacts rather than only in a reviewer's local checkout.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxkbcommon-x11-0
      - name: Install package
        run: python -m pip install .
      - name: Render the interface
        run: python -m wynxo --snapshot artifacts/screenshots
      - name: Check every scene rendered
        run: |
          count=$(ls artifacts/screenshots/*.png | wc -l)
          test "$count" -ge 9 || { echo "expected 9 screenshots, got $count"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wynxo-screenshots
          path: artifacts/screenshots
