name: Apply project instructions

on:
  push:
    branches: [work/finish-astra-gui-core]
    paths:
      - '.github/workflows/apply-project-instructions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/finish-astra-gui-core
          fetch-depth: 0
      - name: Wire repository guidance into Work and Wynxi
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('wynxo/workspace.py')
          text = path.read_text()
          text = text.replace(
              'from . import project_context\n',
              'from . import project_context\nfrom . import project_instructions\n',
              1,
          )

          old_project = '''        project = str(kwargs.get("project", "") or "")\n        if project:\n            if args:\n                args = (project_context.inject(list(args[0]), project),) + args[1:]\n            else:\n                kwargs["messages"] = project_context.inject(list(kwargs.get("messages", [])), project)\n\n        original_execute = desktop.execute\n'''
          new_project = '''        project = str(kwargs.get("project", "") or "")\n        if project:\n            if args:\n                messages = project_context.inject(list(args[0]), project)\n                messages = project_instructions.inject(messages, project)\n                args = (messages,) + args[1:]\n            else:\n                messages = project_context.inject(list(kwargs.get("messages", [])), project)\n                kwargs["messages"] = project_instructions.inject(messages, project)\n\n        original_execute = desktop.execute\n'''
          if old_project not in text:
              raise SystemExit('project injection anchor not found')
          text = text.replace(old_project, new_project, 1)

          old_return = '            return project_context.strip(super().run(*args, **kwargs))\n'
          new_return = '''            result = super().run(*args, **kwargs)\n            return project_context.strip(project_instructions.strip(result))\n'''
          if old_return not in text:
              raise SystemExit('project strip anchor not found')
          text = text.replace(old_return, new_return, 1)

          old_init = '''        self._usage = TokenUsageTracker(self.store)\n        # Draft text is cheap state worth surviving a restart, but attachments are\n'''
          new_init = '''        self._usage = TokenUsageTracker(self.store)\n        self._project_instructions_summary = project_instructions.summary(self._working_directory)\n        # Draft text is cheap state worth surviving a restart, but attachments are\n'''
          if old_init not in text:
              raise SystemExit('workspace init anchor not found')
          text = text.replace(old_init, new_init, 1)

          property_anchor = '''    @Property(str, notify=planChanged)\n    def planSummary(self):\n        if not self._plan_steps:\n            return ""\n        completed = sum(step["status"] in {"completed", "skipped"} for step in self._plan_steps)\n        return f"{completed} of {len(self._plan_steps)} complete"\n\n'''
          property_add = '''    @Property(str, notify=changed)\n    def projectInstructionsSummary(self):\n        return self._project_instructions_summary\n\n    def _refresh_project_instructions(self) -> None:\n        fresh = project_instructions.summary(self._working_directory)\n        if fresh != self._project_instructions_summary:\n            self._project_instructions_summary = fresh\n            self.changed.emit()\n\n'''
          if property_anchor not in text:
              raise SystemExit('plan summary anchor not found')
          text = text.replace(property_anchor, property_anchor + property_add, 1)

          old_set_project = '''        self._working_directory = path\n        self.store.set_setting("working_directory", path)\n        if path:\n'''
          new_set_project = '''        self._working_directory = path\n        self.store.set_setting("working_directory", path)\n        self._project_instructions_summary = project_instructions.summary(path)\n        if path:\n'''
          if old_set_project not in text:
              raise SystemExit('set project anchor not found')
          text = text.replace(old_set_project, new_set_project, 1)

          old_start = '''    def _start_run(self, history):\n        self._busy = True\n'''
          new_start = '''    def _start_run(self, history):\n        self._refresh_project_instructions()\n        self._busy = True\n'''
          if old_start not in text:
              raise SystemExit('start run anchor not found')
          text = text.replace(old_start, new_start, 1)
          path.write_text(text)

          qml = Path('wynxo/ui/Wynxo/TaskHeader.qml')
          ui = qml.read_text()
          anchor = '''        Chip {\n            visible: !root.homeMode && bridge && root.resolvedMode === "work"\n                     && bridge.desktopEnabled && !bridge.busy && root.roomy\n            text: "Screen"\n            iconName: "cursor"\n            selected: true\n            onClicked: root.openAgentSettings()\n            ToolTip.visible: hovered\n            ToolTip.text: bridge ? "Permission mode: " + bridge.permissionModeLabel : ""\n        }\n\n'''
          addition = '''        Chip {\n            visible: !root.homeMode && bridge && bridge.projectName\n                     && root.resolvedMode !== "chat" && bridge.projectInstructionsSummary && root.roomy\n            text: "Project rules"\n            iconName: "code"\n            ToolTip.visible: hovered\n            ToolTip.delay: 450\n            ToolTip.text: bridge ? "Active repository guidance: " + bridge.projectInstructionsSummary\n                                  + ". These files guide coding conventions but never grant permissions." : ""\n        }\n\n'''
          if anchor not in ui:
              raise SystemExit('TaskHeader screen chip anchor not found')
          ui = ui.replace(anchor, anchor + addition, 1)
          qml.write_text(ui)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-project-instructions.yml
          git config user.name wynxo-ci
          git config user.email 318229878+wynxo@users.noreply.github.com
          git add wynxo/workspace.py wynxo/ui/Wynxo/TaskHeader.qml wynxo/project_instructions.py tests/test_project_instructions.py .github/workflows/apply-project-instructions.yml
          git commit -m "Honor visible repository instructions in Work and Wynxi"
          git push origin HEAD:work/finish-astra-gui-core
