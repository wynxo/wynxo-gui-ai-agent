name: Fix WorkspaceController Qt signal ownership on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-workspace-qt-signal-main.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Give workspace properties a subclass-owned notify signal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wynxo/workspace.py')
          text = path.read_text(encoding='utf-8')

          anchor = '    usageChanged = Signal()\n'
          if '    contextStateChanged = Signal()\n' not in text:
              if anchor not in text:
                  raise SystemExit('WorkspaceController signal anchor missing')
              text = text.replace(anchor, anchor + '    contextStateChanged = Signal()\n', 1)

          inherited = text.count('notify=Controller.changed')
          if inherited < 1:
              raise SystemExit('Expected inherited Controller.changed property notifiers')
          text = text.replace('notify=Controller.changed', 'notify=contextStateChanged')

          old = '''        if fresh != self._project_instructions_summary:\n            self._project_instructions_summary = fresh\n            self.changed.emit()\n'''
          new = '''        if fresh != self._project_instructions_summary:\n            self._project_instructions_summary = fresh\n            self.contextStateChanged.emit()\n            self.changed.emit()\n'''
          if old not in text:
              raise SystemExit('Project instruction refresh block missing')
          text = text.replace(old, new, 1)

          old = '''        self._project_instructions_summary = project_instructions.summary(path)\n        if path:\n'''
          new = '''        fresh_instructions = project_instructions.summary(path)\n        if fresh_instructions != self._project_instructions_summary:\n            self._project_instructions_summary = fresh_instructions\n            self.contextStateChanged.emit()\n        if path:\n'''
          if old not in text:
              raise SystemExit('Project switch instruction block missing')
          text = text.replace(old, new, 1)

          old = '''        self._refresh_project_instructions()\n        self._context_omitted_turns = 0\n        self._busy = True\n'''
          new = '''        self._refresh_project_instructions()\n        if self._context_omitted_turns:\n            self._context_omitted_turns = 0\n            self.contextStateChanged.emit()\n        self._busy = True\n'''
          if old not in text:
              raise SystemExit('Run-start context reset block missing')
          text = text.replace(old, new, 1)

          old = '''        if kind == "context_compacted":\n            self._context_omitted_turns = max(0, int(event.get("omitted_turns", 0) or 0))\n            self.changed.emit()\n            return\n'''
          new = '''        if kind == "context_compacted":\n            fresh_omitted = max(0, int(event.get("omitted_turns", 0) or 0))\n            if fresh_omitted != self._context_omitted_turns:\n                self._context_omitted_turns = fresh_omitted\n                self.contextStateChanged.emit()\n            self.changed.emit()\n            return\n'''
          if old not in text:
              raise SystemExit('Context compacted event block missing')
          text = text.replace(old, new, 1)

          if 'notify=Controller.changed' in text or 'notify=changed' in text:
              raise SystemExit('Unsafe inherited Qt property notifier remains')

          path.write_text(text, encoding='utf-8')
          print(f'replaced {inherited} inherited property notifier(s) with contextStateChanged')
          PY
      - name: Remove one-shot workflow and commit to main
        run: |
          rm .github/workflows/fix-workspace-qt-signal-main.yml
          git config user.name 'wynxo-ci'
          git config user.email '318229878+wynxo@users.noreply.github.com'
          git add wynxo/workspace.py .github/workflows/fix-workspace-qt-signal-main.yml
          git commit -m 'Use WorkspaceController-owned Qt notify signals'
          git push origin HEAD:main
