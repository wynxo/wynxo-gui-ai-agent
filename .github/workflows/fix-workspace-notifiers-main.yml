name: Fix workspace inherited notifiers on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-workspace-notifiers-main.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix every inherited changed notifier
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wynxo/workspace.py')
          text = path.read_text(encoding='utf-8')
          count = text.count('notify=changed')
          if count < 1:
              raise SystemExit('No inherited notify=changed declarations found')
          text = text.replace('notify=changed', 'notify=Controller.changed')
          if 'notify=changed' in text:
              raise SystemExit('An inherited changed notifier remains')
          path.write_text(text, encoding='utf-8')
          print(f'fixed {count} remaining inherited notifier(s)')
          PY
      - name: Remove one-shot workflow and commit to main
        run: |
          rm .github/workflows/fix-workspace-notifiers-main.yml
          git config user.name 'wynxo-ci'
          git config user.email '318229878+wynxo@users.noreply.github.com'
          git add wynxo/workspace.py .github/workflows/fix-workspace-notifiers-main.yml
          git commit -m 'Fix all WorkspaceController inherited Qt notifiers'
          git push origin HEAD:main
