name: Cleanup branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
          done

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "wynxo-ci"
          git config user.email "318229878+wynxo@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "Remove one-shot branch cleanup"
          git push origin HEAD:main
